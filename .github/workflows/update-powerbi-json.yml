name: Update Power BI JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Run loader
        env:
          RRMS_USERNAME: ${{ secrets.RRMS_USERNAME }}
          RRMS_PASSWORD: ${{ secrets.RRMS_PASSWORD }}
          RRMS_PERSON_WORKERS: "4"
          RRMS_REQUEST_RETRIES: "5"
        run: uv run python scripts/build_powerbi_json.py --all-pages --incremental --verbose --person-workers 4

      # NOTE: a metrics outage must not block the RRMS training data. On failure the script writes nothing, so the committed training_metrics.json is kept.
      - name: Fetch training metrics
        id: training_metrics
        continue-on-error: true
        env:
          TRAINING_METRICS_API_TOKEN: ${{ secrets.TRAINING_METRICS_API_TOKEN }}
          TRAINING_METRICS_URL: ${{ vars.TRAINING_METRICS_URL || 'https://rrms.ifrc.org/api/api/v1/training-metrics' }}
          RRMS_REQUEST_RETRIES: "5"
        run: uv run python scripts/fetch_training_metrics.py --incremental --verbose

      - name: Report training metrics failure
        if: steps.training_metrics.outcome == 'failure'
        run: echo "::warning::Training metrics fetch failed; keeping the previous training_metrics.json and continuing with the RRMS training data."

      - name: Validate Power BI outputs
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=100000000
          files=(
            data/powerbi/powerbi_training_events.json
            data/powerbi/powerbi_loader_manifest.json
            data/powerbi/trainings_facilitator_model.json
            data/powerbi/training_metrics.json
            data/powerbi/training_metrics_manifest.json
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file was not created."
              exit 1
            fi
            size=$(wc -c < "$file")
            echo "$file: $size bytes"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$file is larger than GitHub's 100 MB file limit."
              exit 1
            fi
          done
          PYTHONPATH=src uv run python - <<'PY'
          import json
          from pathlib import Path
          from surge_data_loader.pii import validate_no_forbidden_fields

          events_path = Path("data/powerbi/powerbi_training_events.json")
          manifest_path = Path("data/powerbi/powerbi_loader_manifest.json")
          model_path = Path("data/powerbi/trainings_facilitator_model.json")
          metrics_path = Path("data/powerbi/training_metrics.json")
          metrics_manifest_path = Path("data/powerbi/training_metrics_manifest.json")
          events = json.loads(events_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          model = json.loads(model_path.read_text(encoding="utf-8"))
          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          metrics_manifest = json.loads(metrics_manifest_path.read_text(encoding="utf-8"))
          if not isinstance(events, list):
              raise SystemExit("powerbi_training_events.json must be a JSON array.")
          if not isinstance(manifest, dict):
              raise SystemExit("powerbi_loader_manifest.json must be a JSON object.")
          if not isinstance(model, dict):
              raise SystemExit("trainings_facilitator_model.json must be a JSON object.")
          if not isinstance(metrics, dict):
              raise SystemExit("training_metrics.json must be a JSON object.")
          if not isinstance(metrics_manifest, dict):
              raise SystemExit("training_metrics_manifest.json must be a JSON object.")
          if "dashboard_summary" not in manifest:
              raise SystemExit("powerbi_loader_manifest.json is missing dashboard_summary.")
          if "participant_role_counts" not in manifest:
              raise SystemExit("powerbi_loader_manifest.json is missing participant_role_counts.")
          if "tables" not in model:
              raise SystemExit("trainings_facilitator_model.json is missing tables.")
          if "metrics" not in metrics:
              raise SystemExit("training_metrics.json is missing metrics.")
          if "payload_sha256" not in metrics_manifest:
              raise SystemExit("training_metrics_manifest.json is missing payload_sha256.")
          for table_name, table in model["tables"].items():
              if not isinstance(table, dict) or "columns" not in table or "rows" not in table:
                  raise SystemExit(f"{table_name} must have columns and rows.")
          validate_no_forbidden_fields(events)
          validate_no_forbidden_fields(manifest)
          validate_no_forbidden_fields(model)
          validate_no_forbidden_fields(metrics)
          validate_no_forbidden_fields(metrics_manifest)
          PY

      - name: Commit updated JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/powerbi/powerbi_training_events.json \
            data/powerbi/powerbi_loader_manifest.json \
            data/powerbi/trainings_facilitator_model.json \
            data/powerbi/training_metrics.json \
            data/powerbi/training_metrics_manifest.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi
          git commit -m "Update Power BI JSON outputs"
          git push
