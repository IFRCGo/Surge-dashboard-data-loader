name: Update Power BI JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run loader
        env:
          RRMS_USERNAME: ${{ secrets.RRMS_USERNAME }}
          RRMS_PASSWORD: ${{ secrets.RRMS_PASSWORD }}
          RRMS_PERSON_WORKERS: "4"
          RRMS_REQUEST_RETRIES: "5"
        run: uv run python scripts/build_powerbi_json.py --all-pages --incremental --verbose --person-workers 4

      - name: Validate output sizes
        shell: bash
        run: |
          max_bytes=100000000
          for file in data/powerbi/*.json; do
            [ -f "$file" ] || continue
            size=$(wc -c < "$file")
            echo "$file: $size bytes"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$file is larger than GitHub's 100 MB file limit."
              exit 1
            fi
          done

      - name: Commit updated JSON outputs
        run: |
          if [ ! -d data/powerbi ]; then
            echo "No data/powerbi directory found."
            exit 0
          fi
          if ! find data/powerbi -maxdepth 1 -name "*.json" | grep -q .; then
            echo "No JSON outputs found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/powerbi/*.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi
          git commit -m "Update Power BI JSON outputs"
          git push
